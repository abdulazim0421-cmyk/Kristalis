<body class="gal-page">

                            <stop offset="0" stop-color="#c9904a"/>
                            <stop offset="0.35" stop-color="#fff1cf"/>
                            <stop offset="0.65" stop-color="#f0c27a"/>
                            <stop offset="1" stop-color="#c9904a"/>
                        </linearGradient>
                    </defs>
                    <circle cx="24" cy="24" r="22.5" fill="none" stroke="url(#kr-gold-nav)" stroke-width="1.1"/>
                    <g fill="url(#kr-gold-nav)" stroke="url(#kr-gold-nav)" stroke-linecap="round" stroke-linejoin="round">

            <div class="header__tools">
                <a class="gal-back" href="index.html">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

                <div class="lang" id="lang">

                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.8 2.6 4.2 5.6 4.2 9s-1.4 6.4-4.2 9c-2.8-2.6-4.2-5.6-4.2-9S9.2 5.6 12 3z"/></svg>

</div>

<main class="gal">
    <section class="gal-intro" id="gal-home">
        <div class="wrap">
            <h1 class="gal-title" data-i18n="galTitle">Галерея</h1>
            <p class="gal-lead" data-i18n="galLead">Выберите зал, чтобы посмотреть фотографии</p>
            <div class="gal-cats" id="gal-cats"></div>
        </div>
    </section>

    <section class="gal-view" id="gal-view" hidden>
        <div class="wrap gal-view__head">
            <button type="button" class="gal-all" id="gal-all">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span data-i18n="galAll">Все залы</span>
            </button>
            <div class="gal-view__title">
                <h2 id="gal-name"></h2>
                <p id="gal-count"></p>
            </div>
        </div>
        <div class="wrap gal-chips" id="gal-chips" role="group"></div>
        <div class="gal-rows" id="gal-rows"></div>
        <p class="gal-hint" data-i18n="galHint">Коснитесь фото, чтобы рассмотреть его. Коснитесь ещё раз, чтобы продолжить.</p>
    </section>
</main>
